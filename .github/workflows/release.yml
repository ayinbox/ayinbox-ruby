name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check the tag matches the gem version
        run: |
          gem_version="$(ruby -Ilib -e 'require "ayinbox/version"; print Ayinbox::VERSION')"
          if [ "v${gem_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${gem_version}"
            exit 1
          fi
      - run: bundle exec rake test
      - uses: rubygems/release-gem@v1
